<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acrylic & Polycarbonate Manufacturer in Ahmedabad | Henil Enterprise</title>
    <!--
      No static <meta name="description"> here on purpose. Every route
      that gets prerendered (see src/prerender.jsx) injects its own
      page-specific description into <head>; a second, generic one
      hardcoded here would sit alongside it as a duplicate description
      tag, and search engines only ever honor one. The one true
      fallback source for a route that somehow isn't prerendered is the
      client-side useMetaDescription hook (see hooks/useMetaDescription.js),
      which every page already calls via useSeo.
    -->
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:site_name" content="Henil Enterprise" />
    <!--
      og:type intentionally omitted here too, same reasoning as the
      description above: every prerendered route's head already sets
      it (always "website" — see buildMetaHead in src/prerender.jsx),
      and the client-side useSeo hook sets it for any route that isn't
      prerendered. A static copy here would just be a second identical
      tag, not a conflicting one, but there's no reason to duplicate it.
    -->


    <!--
      Google Search Console domain-verification meta tag. Vite replaces
      %VITE_GSC_VERIFICATION_CODE% with the value of that env var at
      build/dev time (Vite's built-in HTML env-variable interpolation —
      no plugin needed). Leave the env var unset and this tag simply
      renders with an empty content="" attribute, which is harmless and
      not indexed as anything — see SEO-SETUP.md for how to get a real
      verification code from Search Console and set the variable.
    -->
    <meta name="google-site-verification" content="%VITE_GSC_VERIFICATION_CODE%" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
