<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acrylic & Polycarbonate Manufacturer in Ahmedabad | Henil Enterprise</title>
    <meta name="description" content="Henil Enterprise is a B2B acrylic and polycarbonate manufacturer and fabricator based in Ahmedabad, Gujarat, building custom components to your drawing for businesses across India." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:site_name" content="Henil Enterprise" />
    <meta property="og:type" content="website" />

    <!--
      Google Search Console domain-verification meta tag. Vite replaces
      %VITE_GSC_VERIFICATION_CODE% with the value of that env var at
      build/dev time (Vite's built-in HTML env-variable interpolation —
      no plugin needed). Leave the env var unset and this tag simply
      renders with an empty content="" attribute, which is harmless and
      not indexed as anything — see SEO-SETUP.md for how to get a real
      verification code from Search Console and set the variable.
    -->
    <meta name="google-site-verification" content="%VITE_GSC_VERIFICATION_CODE%" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
